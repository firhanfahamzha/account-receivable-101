<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantangan · Account Receivable 101</title>
<meta name="description" content="2 mini games piutang: Sortir Cepat & Jurnal Rush.">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/tantangan.css">
</head>
<body class="tantangan-page">

<div class="loader">
  <div class="loader-mark">ARCADE MODE</div>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  <div class="loader-text">Menyiapkan tantangan...</div>
</div>

<div class="bg-aurora" aria-hidden="true">
  <div class="aurora-blob b1"></div>
  <div class="aurora-blob b2"></div>
  <div class="aurora-blob b3"></div>
</div>
<canvas id="particles" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><i class="fas fa-bolt"></i></div>
    <div class="brand-text">
      Tantangan Kilat
      <small>AR 101 · 2 Mini Games</small>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="index.html" class="icon-btn" title="Hub"><i class="fas fa-house"></i></a>
    <button class="icon-btn" data-action="sound" title="Suara"><i class="fas fa-volume-high"></i></button>
    <button class="icon-btn" data-action="theme" title="Tema"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" data-action="share" title="Bagikan"><i class="fas fa-share-nodes"></i></button>
  </div>
</header>

<main class="game-shell">

  <div class="game-tabs">
    <button class="game-tab active" data-game="sortir">
      <i class="fas fa-layer-group"></i> Sortir Cepat
    </button>
    <button class="game-tab" data-game="jr">
      <i class="fas fa-book-journal-whills"></i> Jurnal Rush
    </button>
  </div>

  <div class="game-panel active" data-panel="sortir">
    <div id="game-sortir-stage"></div>
  </div>

  <div class="game-panel" data-panel="jr">
    <div id="game-jr-stage"></div>
  </div>

</main>

<footer class="footer" style="margin-top:40px">
  <div>Tantangan Kilat · <strong>Accounting Teaching Challenge 2026</strong></div>
  <div class="wm"><i class="fas fa-user-pen"></i> Firhan Fahamzha · ITB Asia Malang</div>
</footer>

<script src="js/core.js"></script>
<script src="js/space.js"></script>
<script src="js/tantangan.js"></script>
</body>
</html>
